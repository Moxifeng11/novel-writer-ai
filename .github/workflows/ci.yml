name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限（W-6）：verify/e2e 均为只读检查，无需写权限；release.yml 已单独最小化
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（v4 浮动 tag 当前指向，SHA 锚定）

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0（v4 浮动 tag 当前指向，SHA 锚定）
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生产依赖安全审计
        run: npm run audit:deps

      - name: 校验内置模板生成物
        run: npm run check:templates

      - name: Lint
        run: npm run lint

      - name: 样式源与产物一致性
        run: npm run check:styles

      - name: CSS 预算与命名检查
        run: npm run check:css

      - name: 内联样式基线检查
        run: npm run check:inline-styles

      - name: Obsidian API 用法门禁（棘轮基线）
        run: npm run check:obsidian-api

      - name: 密钥泄露门禁（被跟踪文件）
        run: npm run check:secrets

      - name: 分层依赖与循环依赖（棘轮基线）
        run: npm run check:deps -- --baseline .arch-baseline.json --require-baseline

      - name: EngineRegistry 实例白名单
        run: npm run check-engines

      - name: 文档与注释门禁
        run: |
          npm run gen:docs -- --check
          npm run check:jsdoc
          npm run check:any
          npm run check:changelog
          npm run check:docs

      - name: Typecheck
        run: npm run typecheck

      - name: 单元测试与覆盖率门禁
        run: npm run test:cov

      - name: 构建
        run: npm run build

      # 体积门禁（v4.34.0 新增）：check:bundle 校验构建产物体积，
      # 必须在 npm run build 之后运行（对照基线 .bundle-baseline.json）。
      - name: 校验构建产物体积预算
        run: npm run check:bundle

      - name: 发布资产校验
        run: npm run check:release

      - name: 校验构建未产生版本/生成物漂移
        run: git diff --exit-code -- manifest.json versions.json shared/template-scaffold-assets.generated.ts styles.css docs/generated

      - name: 关系数据权威源契约
        run: npm run check:relationship-authority

      - name: 用户操作型静默失败检查
        run: npm run check:silent-failures

      - name: 热路径全库扫描检查
        run: npm run check:hotpaths

      - name: 联动场景清单锚点检查
        run: npm run check:linked-scenarios

      - name: dsh 后端隔离检查
        run: npm run check:dsh-isolation

      - name: 专项进度台账与报告一致性
        run: npm run check:program

      - name: 校验构建产物未入仓
        run: |
          if git ls-files | grep -Eq '^(main\.js|workers/|\.hotreload)'; then
            echo "构建产物不应被 git 跟踪："
            git ls-files | grep -E '^(main\.js|workers/|\.hotreload)'
            exit 1
          fi

      - name: 校验 E2E 用例可解析
        run: npx playwright test --list

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2（v4 浮动 tag 当前指向，SHA 锚定）
        with:
          name: novel-writer-ai-dist
          path: |
            main.js
            manifest.json
            styles.css
            workers/
          if-no-files-found: error

  cross-platform:
    name: 跨平台矩阵（${{ matrix.os }}）
    # Linux 由 verify 覆盖；这里补 Windows / macOS 的类型与单测，防止路径分隔符、
    # 文件编码、大小写敏感等只在单一 OS 暴露的问题进入发布。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（v4 浮动 tag 当前指向，SHA 锚定）

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0（v4 浮动 tag 当前指向，SHA 锚定）
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: 单元测试
        run: npm test

  e2e-obsidian:
    name: E2E（Obsidian 真实链路）
    # 需要仓库变量 OBSIDIAN_PATH 指向已安装的 Obsidian 可执行文件。
    # 未配置时该 job 明确显示 skipped，不会伪装成通过。
    if: ${{ vars.OBSIDIAN_PATH != '' }}
    runs-on: ${{ vars.OBSIDIAN_E2E_RUNNER || 'windows-latest' }}
    env:
      OBSIDIAN_PATH: ${{ vars.OBSIDIAN_PATH }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（v4 浮动 tag 当前指向，SHA 锚定）

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0（v4 浮动 tag 当前指向，SHA 锚定）
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建插件
        run: npm run build

      - name: E2E（创建项目 → 打开工作台）
        run: npm run test:e2e

      - name: 上传 E2E 报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2（v4 浮动 tag 当前指向，SHA 锚定）
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

