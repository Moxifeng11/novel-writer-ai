name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（v4 浮动 tag 当前指向，SHA 锚定）

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0（v4 浮动 tag 当前指向，SHA 锚定）
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生产依赖安全审计
        run: npm run audit:deps

      - name: 校验内置模板生成物
        run: npm run check:templates

      - name: Lint
        run: npm run lint

      - name: CSS 预算与命名检查
        run: npm run check:css

      - name: 样式/依赖/引擎/台账/热路径/联动/隔离 全量门禁
        run: |
          npm run check:styles
          npm run check:deps -- --baseline .arch-baseline.json
          npm run check-engines
          npm run check:program
          npm run check:relationship-authority
          npm run check:silent-failures
          npm run check:hotpaths
          npm run check:linked-scenarios
          npm run check:dsh-isolation

      - name: 内联样式基线检查
        run: npm run check:inline-styles

      - name: 文档与注释门禁
        run: |
          npm run gen:docs -- --check
          npm run check:jsdoc
          npm run check:any
          npm run check:changelog
          npm run check:docs

      - name: Typecheck
        run: npm run typecheck

      - name: 单元测试与覆盖率门禁
        run: npm run test:cov

      - name: 构建
        run: npm run build

      - name: 发布资产校验（含 tag 版本一致性）
        run: npm run check:release -- --tag "$GITHUB_REF_NAME"

      - name: 校验构建未产生版本/生成物漂移
        run: git diff --exit-code -- manifest.json versions.json shared/template-scaffold-assets.generated.ts styles.css docs/generated

      - name: 打包发布 zip（含 Worker 产物）
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ZIP="novel-writer-ai-${TAG}.zip"
          zip -r "$ZIP" main.js manifest.json styles.css workers
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: 生成发布资产校验和（SHA256SUMS.txt）
        run: |
          set -euo pipefail
          # 校验和覆盖全部发布资产（与下方 ASSETS 清单一致，含 zip）。
          # runner 为 ubuntu-latest（bash），故使用 sha256sum；Windows/macOS runner 才需换用 Get-FileHash/shasum。
          # 文件内使用相对文件名，便于下载方在任意目录核对。
          sha256sum main.js manifest.json styles.css versions.json \
            workers/deconstruction-worker.js workers/quality-worker.js "$ZIP" \
            > SHA256SUMS.txt

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/releases/${TAG}.md"
          # SHA256SUMS.txt 为校验和清单，不属于 check-release.mjs 的 worker/versions 比对范围（该脚本按前缀过滤）
          ASSETS=(main.js manifest.json styles.css versions.json workers/deconstruction-worker.js workers/quality-worker.js "$ZIP" SHA256SUMS.txt)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传资产"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" --generate-notes
          fi
