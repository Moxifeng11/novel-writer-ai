name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生产依赖安全审计
        run: npm run audit:deps

      - name: 校验内置模板生成物
        run: npm run check:templates

      - name: Lint
        run: npm run lint

      - name: CSS 预算与命名检查
        run: npm run check:css

      - name: 样式/依赖/引擎/台账/热路径/联动/隔离 全量门禁
        run: |
          npm run check:styles
          npm run check:deps -- --baseline .arch-baseline.json
          npm run check-engines
          npm run check:program
          npm run check:relationship-authority
          npm run check:silent-failures
          npm run check:hotpaths
          npm run check:linked-scenarios
          npm run check:dsh-isolation

      - name: 内联样式基线检查
        run: npm run check:inline-styles

      - name: 文档与注释门禁
        run: |
          npm run gen:docs -- --check
          npm run check:jsdoc
          npm run check:any
          npm run check:changelog
          npm run check:docs

      - name: Typecheck
        run: npm run typecheck

      - name: 单元测试与覆盖率门禁
        run: npm run test:cov

      - name: 构建
        run: npm run build

      - name: 发布资产校验（含 tag 版本一致性）
        run: npm run check:release -- --tag "$GITHUB_REF_NAME"

      - name: 校验构建未产生版本/生成物漂移
        run: git diff --exit-code -- manifest.json versions.json shared/template-scaffold-assets.generated.ts styles.css docs/generated

      - name: 打包发布 zip（含 Worker 产物）
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ZIP="novel-writer-ai-${TAG}.zip"
          zip -r "$ZIP" main.js manifest.json styles.css workers
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/releases/${TAG}.md"
          ASSETS=(main.js manifest.json styles.css versions.json workers/deconstruction-worker.js workers/quality-worker.js "$ZIP")

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传资产"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" --generate-notes
          fi
